name: SingBox Proxy Updater V2

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Следующий запуск ожидает завершения предыдущего, не перезаписывая его результаты.
concurrency:
  group: singbox-proxy-updater
  cancel-in-progress: false

jobs:
  run-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache GeoIP Databases
        uses: actions/cache@v4
        with:
          path: geo_dbs
          key: geoip-mmdb-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get latest Sing-box release tag
        id: getRelease
        run: |
          TAG=""
          for i in {1..3}; do
            TAG=$(curl -sL -H "Accept: application/vnd.github.v3+json" \
                       -H "User-Agent: BoxRunner" \
                       https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name // empty')
            if [ -n "$TAG" ]; then
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 2
          done
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest release tag, using fallback v1.12.0"
            TAG="v1.12.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Cache sing-box binary
        id: cache-sing-box
        uses: actions/cache@v4
        with:
          path: ./sing-box
          key: sing-box-${{ steps.getRelease.outputs.tag }}

      - name: Download and extract sing-box (if missing)
        run: |
          if [ -f ./sing-box ]; then
            echo "sing-box already exists, skipping download"
            exit 0
          fi
          TAG="${{ steps.getRelease.outputs.tag }}"
          FILENAME="sing-box-${TAG#v}-linux-amd64.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/${FILENAME}"
          for i in {1..3}; do
            if wget -q --tries=1 --timeout=30 "$URL" -O sing-box.tar.gz; then
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Download failed after 3 attempts" >&2
              exit 1
            fi
            echo "Retry $i..."
            sleep 3
          done
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box

      - name: Show sing-box version
        run: ./sing-box version

      - name: Run Logic V2 (collect and check proxies)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJ_ID: ${{ secrets.PROJ_ID }}
        run: python main_v2.py

      - name: Generate Clash YAML profile
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python generate_clash_yaml.py
